<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Browse Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body id="browsePage">
    <header class="main-header">
        <img src="/images/logo.png" alt="HouseHop" class="header-logo">
        <nav class="main-nav">
            <a href="/browse">Browse</a>
            <a href="/my-bookings">My Bookings</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="browse-main">
        <div class="browse-hero">
            <img src="/images/browse-listings.png" alt="Browse Listings" class="browse-listings-img">
            <p>Where we hopping to today?</p>
        </div>

        <div class="controls browse-controls">
            <input id="search" placeholder="Search by name" oninput="loadListings()">
            <input id="location" placeholder="Location" oninput="loadListings()">
            <input id="date" type="text" placeholder="Date" onfocus="(this.type='date')"
                onblur="(this.value==''?this.type='text':this.type='date')">
            <div class="filters-container" style="position: relative;">
                <button class="btn-filters" onclick="toggleFilters()">
                    <img src="/images/filter-icon.png" alt="Filter"
                        style="width: 24px; height: 24px; object-fit: contain;">
                    FILTERS
                </button>

                <div id="filterDropdown" class="filter-dropdown" style="display:none;">
                    <div class="filter-group">
                        <select id="type" onchange="loadListings()">
                            <option value="">Type</option>
                            <option value="hotel">Hotel</option>
                            <option value="apartment">Apartment</option>
                            <option value="dorm">Dorm</option>
                            <option value="guest_room">Guest Room</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="sort" onchange="loadListings()">
                            <option value="">Price</option>
                            <option value="price_asc">Price: Low to High</option>
                            <option value="price_desc">Price: High to Low</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="section-title">Popular Homes</h2>
        <div id="listingsGrid" class="browse-grid"></div>
    </main>

    <script>
        function toggleFilters() {
            const dropdown = document.getElementById('filterDropdown');
            const btn = document.querySelector('.btn-filters');
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'flex';
                btn.classList.add('active');
            } else {
                dropdown.style.display = 'none';
                btn.classList.remove('active');
            }
        }

        async function loadListings() {
            const search = document.getElementById("search").value;
            const location = document.getElementById("location").value;
            const type = document.getElementById("type").value;
            const sort = document.getElementById("sort").value;

            const params = new URLSearchParams();
            if (search) params.append("search", search);
            if (location) params.append("location", location);
            if (type) params.append("type", type);
            if (sort) params.append("sort", sort);

            const res = await fetch("/listings?" + params.toString());
            const listings = await res.json();

            const grid = document.getElementById("listingsGrid");
            grid.innerHTML = "";

            if (listings.length === 0) {
                grid.innerHTML = "<p>No listings found.</p>";
                return;
            }

            const typeLabels = {
                hotel: "Hotel",
                apartment: "Apartment",
                dorm: "Dorm",
                guest_room: "Guest Room"
            };

            listings.forEach(l => {
                const card = document.createElement("div");
                card.className = "browse-card";
                card.onclick = () => window.location.href = "/booking/" + l._id;

                const dummyDesc = "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.";
                const desc = l.description ? l.description : dummyDesc;

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${l.image || '/images/placeholder.png'}" alt="${l.name}">
                    </div>
                    <h3>${l.name}</h3>
                    <p class="desc">${desc}</p>
                    <p class="price"><strong>${l.price}</strong> for x nights</p>
                `;
                grid.appendChild(card);
            });
        }

        loadListings();
    </script>
</body>

</html>
