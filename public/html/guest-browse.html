<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Browse Listings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body id="browsePage">
    <header class="main-header">
        <img src="/images/logo.png" alt="HouseHop" class="header-logo">
        <nav class="main-nav">
            <a href="/browse">Browse</a>
            <a href="/my-bookings">My Bookings</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="browse-main">
        <div class="browse-hero">
            <img src="/images/browse-listings.png" alt="Browse Listings" class="browse-listings-img">
            <p>Where we hopping to today?</p>
        </div>

        <div class="controls browse-controls" style="flex-wrap: nowrap; align-items: center; justify-content: center; gap: 15px; width: 100%; max-width: 1200px; padding: 0 20px; box-sizing: border-box;">
            <input id="search" placeholder="Search by name" oninput="loadListings()" style="flex: 1; min-width: 120px;">
            <input id="location" placeholder="Location" oninput="loadListings()" style="flex: 1; min-width: 100px;">
            <div class="date-range-container" style="display: flex; align-items: center; border-radius: 50px; background: rgba(255, 255, 255, 0.95); box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03); padding: 0 15px; flex: 1.5; min-width: 240px; box-sizing: border-box;">
                <input id="checkin" type="text" placeholder="Check In" onfocus="(this.type='date')"
                    onblur="(this.value==''?this.type='text':this.type='date')" onchange="loadListings()" style="border: none; box-shadow: none; min-width: unset; width: 100%; flex: 1; padding: 18px 5px; background: transparent; text-align: center;">
                <span style="color: #b0b0b0; font-family: 'Inter', sans-serif;">-</span>
                <input id="checkout" type="text" placeholder="Check Out" onfocus="(this.type='date')"
                    onblur="(this.value==''?this.type='text':this.type='date')" onchange="loadListings()" style="border: none; box-shadow: none; min-width: unset; width: 100%; flex: 1; padding: 18px 5px; background: transparent; text-align: center;">
            </div>
            <div class="filters-container" style="position: relative;">
                <button class="btn-filters" onclick="toggleFilters()">
                    <img src="/images/filter-icon.png" alt="Filter"
                        style="width: 24px; height: 24px; object-fit: contain;">
                    FILTERS
                </button>

                <div id="filterDropdown" class="filter-dropdown" style="display:none;">
                    <div class="filter-group">
                        <select id="type" onchange="loadListings()">
                            <option value="">Type</option>
                            <option value="hotel">Hotel</option>
                            <option value="apartment">Apartment</option>
                            <option value="dorm">Dorm</option>
                            <option value="guest_room">Guest Room</option>
                        </select>
                    </div>
                    <div class="filter-group">
                        <select id="sort" onchange="loadListings()">
                            <option value="">Price</option>
                            <option value="price_asc">Ascending</option>
                            <option value="price_desc">Descending</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="section-title">Popular Homes</h2>
        <div id="listingsGrid" class="browse-grid"></div>
    </main>

    <script>
        function toggleFilters() {
            const dropdown = document.getElementById('filterDropdown');
            const btn = document.querySelector('.btn-filters');
            if (dropdown.style.display === 'none') {
                dropdown.style.display = 'flex';
                btn.classList.add('active');
            } else {
                dropdown.style.display = 'none';
                btn.classList.remove('active');
            }
        }

        async function loadListings() {
            const search = document.getElementById("search").value;
            const location = document.getElementById("location").value;
            const type = document.getElementById("type").value;
            const sort = document.getElementById("sort").value;
            const checkin = document.getElementById("checkin").value;
            const checkout = document.getElementById("checkout").value;

            const params = new URLSearchParams();
            if (search) params.append("search", search);
            if (location) params.append("location", location);
            if (type) params.append("type", type);
            if (sort) params.append("sort", sort);
            if (checkin) params.append("checkin", checkin);
            if (checkout) params.append("checkout", checkout);

            const res = await fetch("/listings?" + params.toString());
            const listings = await res.json();

            const grid = document.getElementById("listingsGrid");
            grid.innerHTML = "";

            if (listings.length === 0) {
                grid.innerHTML = "<p>No listings found.</p>";
                return;
            }

            const typeLabels = {
                hotel: "Hotel",
                apartment: "Apartment",
                dorm: "Dorm",
                guest_room: "Guest Room"
            };

            listings.forEach(l => {
                const card = document.createElement("div");
                card.className = "browse-card";
                card.onclick = () => window.location.href = "/booking/" + l._id;

                const desc = l.description ? l.description : "";

                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${l.image || '/images/placeholder.png'}" alt="${l.name}">
                    </div>
                    <h3>${l.name}</h3>
                    <p class="desc">${desc}</p>
                    <p class="price"><strong>₱${l.price}</strong> per night</p>
                `;
                grid.appendChild(card);
            });
        }

        loadListings();
    </script>
</body>

</html>
