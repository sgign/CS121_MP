<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - My Listings</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body id="hostPage">

    <header class="headerz">
        <img src="/images/logo.png" alt="HouseHop" class="mini-logo">
        <nav class="nav-buttons">
            <a href="/my-listings">My Listings</a>
            <a href="/booking-requests">Booking Requests</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="host-main">
        <h1>My Listings</h1>

        <div class="host-controls">
            <button class="blue-btn" onclick="openModal()">+ NEW LISTING</button>
            <div class="host-controls-right">
                <input id="searchListings" placeholder="Search by name" oninput="loadMyListings()">
            </div>
        </div>

        <div id="myListingsGrid"></div>
    </main>

    <!-- New / Edit Listing Modal -->
    <div id="listingModal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <h2 id="modalTitle">New Listing</h2>

            <input type="hidden" id="editId">

            <div class="modal-field full-width">
                <label>Listing Name</label>
                <input id="modalName" placeholder="e.g. Cozy Room in Taguig">
            </div>

            <div class="modal-row">
                <div class="modal-field">
                    <label>Location</label>
                    <input id="modalLocation" placeholder="e.g. BGC, Taguig">
                </div>
                <div class="modal-field">
                    <label>Price per Night</label>
                    <input id="modalPrice" type="number" placeholder="e.g. 3000">
                </div>
                <div class="modal-field">
                    <label>Type</label>
                    <select id="modalType">
                        <option value="hotel">Hotel</option>
                        <option value="apartment">Apartment</option>
                        <option value="dorm">Dorm</option>
                        <option value="guest_room">Guest Room</option>
                    </select>
                </div>
            </div>

            <div class="modal-row">
                <div class="modal-field">
                    <label>Description</label>
                    <textarea id="modalDescription" placeholder="Describe your listing..."></textarea>
                </div>
                <div class="modal-field">
                    <label>Contact Number</label>
                    <input id="modalContact" placeholder="e.g. 09171234567">
                    <label style="margin-top:15px;">Upload Photos (or URL)</label>
                    <input id="modalImage" placeholder="https://..." style="margin-bottom: 5px;">
                    <input id="modalImageFile" type="file" multiple accept="image/*" onchange="previewModalImage(event)" style="font-size: 12px; margin-bottom: 5px;">
                    <div id="modalImageGallery" style="display:flex; flex-wrap:wrap; gap:10px; margin-top: 5px;"></div>
                </div>
            </div>

            <div class="modal-footer">
                <button class="blue-btn" onclick="submitListing()">POST LISTING</button>
                <p id="modalMsg"></p>
            </div>
        </div>
    </div>

    <script>
        let editingId = null;
        let uploadedImageUrls = [];

        function previewModalImage(event) {
            const files = Array.from(event.target.files);
            const gallery = document.getElementById('modalImageGallery');
            gallery.innerHTML = '';
            uploadedImageUrls = [];
            
            if (files.length > 0) {
                document.getElementById('modalImage').value = ""; // Clear URL if files uploaded
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    uploadedImageUrls.push(dataUrl);
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = '80px';
                    img.style.height = '80px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '4px';
                    gallery.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        async function loadMyListings() {
            const search = document.getElementById("searchListings").value.toLowerCase();
            const res = await fetch("/listings");
            const all = await res.json();
            const meRes = await fetch("/me");
            const me = await meRes.json();

            const mine = all.filter(l => l.hostId === me.id);
            const filtered = mine.filter(l => l.name.toLowerCase().includes(search));

            const grid = document.getElementById("myListingsGrid");
            grid.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = "<p>No listings yet.</p>";
                return;
            }

            // Check which listings have pending bookings
            const bookingsRes = await fetch("/bookings/host");
            const bookings = await bookingsRes.json();
            const pendingListingIds = new Set(
                bookings.filter(b => b.status === "pending").map(b => b.listingId._id)
            );

            const typeLabels = {
                hotel: "Hotel",
                apartment: "Apartment",
                dorm: "Dorm",
                guest_room: "Guest Room"
            };

            filtered.forEach(l => {
                const hasPending = pendingListingIds.has(l._id);
                const card = document.createElement("div");
                card.className = "listing-card";
                card.innerHTML = `
                    ${hasPending ? `<div class="pending-badge">PENDING REQUESTS</div>` : ""}
                    <img src="${(l.images && l.images.length > 0) ? l.images[0] : (l.image || '/images/placeholder.png')}" alt="${l.name}">
                    <div class="listing-card-info">
                        <h3>${l.name}</h3>
                        <p>${typeLabels[l.type] || l.type} - ${l.location}</p>
                        <p><strong>₱${l.price.toLocaleString()}/night</strong></p>
                        <p>${l.description || ""}</p>
                        <div class="card-actions">
                            <button class="outline-btn" onclick="openEdit(${JSON.stringify(l).replace(/"/g, '&quot;')})">EDIT LISTING</button>
                            <button class="outline-btn" onclick="deleteListing('${l._id}')">DELETE</button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openModal() {
            editingId = null;
            uploadedImageUrl = "";
            document.getElementById("modalTitle").textContent = "New Listing";
            document.getElementById("modalName").value = "";
            document.getElementById("modalLocation").value = "";
            document.getElementById("modalPrice").value = "";
            document.getElementById("modalType").value = "hotel";
            document.getElementById("modalDescription").value = "";
            document.getElementById("modalContact").value = "";
            document.getElementById("modalImage").value = "";
            document.getElementById("modalImageFile").value = "";
            document.getElementById("modalImageGallery").innerHTML = "";
            document.getElementById("modalMsg").textContent = "";
            document.getElementById("listingModal").style.display = "flex";
        }

        function openEdit(listing) {
            editingId = listing._id;
            uploadedImageUrl = "";
            document.getElementById("modalTitle").textContent = "Edit Listing";
            document.getElementById("modalName").value = listing.name;
            document.getElementById("modalLocation").value = listing.location;
            document.getElementById("modalPrice").value = listing.price;
            document.getElementById("modalType").value = listing.type;
            document.getElementById("modalDescription").value = listing.description || "";
            document.getElementById("modalContact").value = listing.contactNumber;
            document.getElementById("modalImage").value = listing.image || "";
            document.getElementById("modalImageFile").value = "";
            
            const gallery = document.getElementById("modalImageGallery");
            gallery.innerHTML = "";
            let editImages = listing.images && listing.images.length > 0 ? listing.images : (listing.image ? [listing.image] : []);
            uploadedImageUrls = [...editImages];
            
            editImages.forEach(imgUrl => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.style.width = '80px';
                img.style.height = '80px';
                img.style.objectFit = 'cover';
                img.style.borderRadius = '4px';
                gallery.appendChild(img);
            });
            document.getElementById("modalMsg").textContent = "";
            document.getElementById("listingModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("listingModal").style.display = "none";
        }

        async function submitListing() {
            let finalImages = [...uploadedImageUrls];
            if (finalImages.length === 0 && document.getElementById("modalImage").value) {
                finalImages.push(document.getElementById("modalImage").value);
            }
            
            const data = {
                name: document.getElementById("modalName").value,
                location: document.getElementById("modalLocation").value,
                price: parseFloat(document.getElementById("modalPrice").value),
                type: document.getElementById("modalType").value,
                description: document.getElementById("modalDescription").value,
                contactNumber: document.getElementById("modalContact").value,
                images: finalImages,
                image: finalImages.length > 0 ? finalImages[0] : "",
            };

            const msg = document.getElementById("modalMsg");
            const url = editingId ? "/listings/" + editingId : "/listings";
            const method = editingId ? "PUT" : "POST";

            const res = await fetch(url, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                closeModal();
                loadMyListings();
            } else {
                const err = await res.json();
                msg.textContent = err.message;
                msg.style.color = "red";
            }
        }

        async function deleteListing(id) {
            if (!confirm("Delete this listing?")) return;
            await fetch("/listings/" + id, { method: "DELETE" });
            loadMyListings();
        }

        loadMyListings();
    </script>
</body>

</html>
