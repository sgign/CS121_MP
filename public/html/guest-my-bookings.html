<!DOCTYPE html>
<html>
<head>
    <title>HouseHop - My Bookings</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="myBookingsPage">
    <header class="main-header">
        <img src="/images/logo.png" alt="HouseHop" class="header-logo">
        <nav class="main-nav">
            <a href="/browse">Browse</a>
            <a href="/my-bookings">My Bookings</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="browse-main" style="max-width: 1200px; margin: 40px auto; padding: 0 20px;">
        <div style="text-align: center; margin-bottom: 30px;">
            <img src="/images/my-bookings.png" alt="MY BOOKINGS" style="max-height: 80px; object-fit: contain;">
        </div>
        
        <div class="controls browse-controls" style="justify-content: flex-end; max-width: 900px; margin: 0 auto 50px auto; gap: 15px;">
            <input id="search" placeholder="Search by name" oninput="loadMyBookings()" style="flex: unset; width: 220px; border-radius: 40px; padding: 12px 20px; font-size: 14px;">
            <select id="statusFilter" onchange="loadMyBookings()" class="btn-filters" style="width: auto; padding: 12px 40px 12px 24px; font-size: 14px; cursor: pointer; appearance: none; -webkit-appearance: none; background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23FFFFFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E'); background-repeat: no-repeat; background-position: right 16px center; background-size: 10px auto;">
                <option value="all">All Statuses</option>
                <option value="approved">Approved</option>
                <option value="pending">Pending</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <div id="bookingsList" class="grid" style="grid-template-columns: 1fr 1fr; gap: 30px; max-width: 900px; margin: 0 auto;"></div>
    </main>

    <script>
        async function loadMyBookings() {
            const res = await fetch("/bookings/my");
            const bookings = await res.json();
            const container = document.getElementById("bookingsList");
            const searchTerm = document.getElementById("search").value.toLowerCase();
            const statusFilter = document.getElementById("statusFilter").value;
            container.innerHTML = "";

            const filteredBookings = bookings.filter(b => {
                const matchesSearch = b.listingId && b.listingId.name.toLowerCase().includes(searchTerm);
                const matchesStatus = statusFilter === "all" || b.status === statusFilter;
                return matchesSearch && matchesStatus;
            });

            if (filteredBookings.length === 0) {
                container.innerHTML = "<p style='font-family: Inter; color: #777;'>No bookings found.</p>";
                return;
            }

            filteredBookings.forEach(b => {
                const card = document.createElement("div");
                card.className = "booking-horizontal-card";

                const listing = b.listingId;
                
                let imageUrl = '/images/placeholder.png';
                if (listing.images && listing.images.length > 0) {
                    imageUrl = listing.images[0];
                } else if (listing.image) {
                    imageUrl = listing.image;
                }

                const statusClass = b.status === "pending" ? "badge-status-pending" : (b.status === "rejected" ? "badge-status-rejected" : "badge-status-approved");
                const locationText = listing.location || "Location will appear here";

                card.innerHTML = `
                    <img src="${imageUrl}" alt="${listing.name}">
                    <div class="booking-horizontal-content">
                        <div>
                            <h3 class="booking-horizontal-title">${listing.name}</h3>
                            <p class="booking-horizontal-desc">${locationText}</p>
                            <p class="booking-horizontal-price">${listing.price.toLocaleString()}/night</p>
                        </div>
                        <span class="badge-status ${statusClass}">REQUEST ${b.status.toUpperCase()}</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        loadMyBookings();
    </script>
</body>
</html>
