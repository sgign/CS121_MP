<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Booking Requests</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body id="hostPage">

    <header class="headerz">
        <img src="/images/logo.png" alt="HouseHop" class="mini-logo">
        <nav class="nav-buttons">
            <a href="/my-listings">My Listings</a>
            <a href="/booking-requests">Booking Requests</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="host-main">
        <h1>Booking Requests</h1>

        <div class="host-controls centered">
            <input id="searchRequests" placeholder="Search by name" oninput="loadRequests()">
            <select id="filterStatus" onchange="loadRequests()">
                <option value="">STATUS</option>
                <option value="pending">Pending</option>
                <option value="approved">Approved</option>
                <option value="rejected">Rejected</option>
            </select>
        </div>

        <div id="requestsGrid"></div>
    </main>

    <script>
        async function loadRequests() {
            const search = document.getElementById("searchRequests").value.toLowerCase();
            const filterStatus = document.getElementById("filterStatus").value;

            const res = await fetch("/bookings/host");
            const bookings = await res.json();

            const filtered = bookings.filter(b => {
                const matchName = b.listingId.name.toLowerCase().includes(search);
                const matchStatus = filterStatus === "" || b.status === filterStatus;
                return matchName && matchStatus;
            });

            const grid = document.getElementById("requestsGrid");
            grid.innerHTML = "";

            if (filtered.length === 0) {
                grid.innerHTML = "<p>No booking requests found.</p>";
                return;
            }

            filtered.forEach(b => {
                const start = new Date(b.startDate).toLocaleDateString();
                const end = new Date(b.endDate).toLocaleDateString();

                const card = document.createElement("div");
                card.className = "request-card";

                let actionHtml = "";
                if (b.status === "pending") {
                    actionHtml = `
                        <button class="approve-btn" onclick="updateStatus('${b._id}', 'approved')">APPROVE</button>
                        <button class="reject-btn" onclick="updateStatus('${b._id}', 'rejected')">REJECT</button>
                    `;
                } else {
                    actionHtml = `<button class="status-badge status-${b.status}">${b.status.toUpperCase()}</button>`;
                }

                card.innerHTML = `
                    <img src="${b.listingId.image || '/images/placeholder.png'}" alt="${b.listingId.name}">
                    <div class="request-info">
                        ${b.status === "pending" ? `<span class="pending-dot">● PENDING</span>` : ""}
                        <h3>${b.listingId.name}</h3>
                        <p>Dates: ${start} to ${end}</p>
                        <p>Guest: ${b.guestUsername}</p>
                        <div class="card-actions">${actionHtml}</div>
                        <p class="err-msg" id="msg-${b._id}"></p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function updateStatus(bookingId, status) {
            const res = await fetch(`/bookings/${bookingId}/status`, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ status })
            });

            if (res.ok) {
                loadRequests();
            } else {
                const data = await res.json();
                const msgEl = document.getElementById("msg-" + bookingId);
                if (msgEl) { msgEl.textContent = data.message; msgEl.style.color = "red"; }
            }
        }

        loadRequests();
    </script>
</body>

</html>
