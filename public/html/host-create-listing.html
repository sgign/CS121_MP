<!DOCTYPE html>
<html>
<head>
    <title>HouseHop - Create Listing</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="createListingPage">
    <header>
        <h2>HouseHop</h2>
        <nav>
            <a href="/my-listings">My Listings</a>
            <a href="/create-listing">+ New Listing</a>
            <a href="/booking-requests">Booking Requests</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main>
        <h1>Create New Listing</h1>

        <div class="form-card">
            <div class="input-group">
                <label>Listing Name</label>
                <input id="name" placeholder="e.g. Cozy Room in Makati">
            </div>
            <div class="input-group">
                <label>Type</label>
                <select id="type">
                    <option value="hotel">Hotel</option>
                    <option value="apartment">Apartment</option>
                    <option value="dorm">Dorm</option>
                    <option value="guest_room">Guest Room</option>
                </select>
            </div>
            <div class="input-group">
                <label>Location</label>
                <input id="location" placeholder="e.g. Manila">
            </div>
            <div class="input-group">
                <label>Price per Night (₱)</label>
                <input id="price" type="number" placeholder="e.g. 1500">
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="description" placeholder="Describe your listing..."></textarea>
            </div>
            <div class="input-group">
                <label>Upload Photos (or URL)</label>
                <input id="image" placeholder="https://..." style="margin-bottom: 5px;">
                <input id="imageFile" type="file" multiple accept="image/*" onchange="previewImage(event)" style="font-size: 12px; margin-bottom: 5px;">
                <div id="imageGallery" style="display:flex; flex-wrap:wrap; gap:10px; margin-top: 10px;"></div>
            </div>
            <div class="input-group">
                <label>Contact Number</label>
                <input id="contactNumber" placeholder="e.g. 09171234567">
            </div>

            <button onclick="createListing()">CREATE LISTING</button>
            <p id="formMsg"></p>
        </div>
    </main>

    <script>
        let uploadedImageUrls = [];

        function previewImage(event) {
            const files = Array.from(event.target.files);
            const gallery = document.getElementById('imageGallery');
            gallery.innerHTML = '';
            uploadedImageUrls = [];
            
            if (files.length > 0) {
                document.getElementById('image').value = ""; // Clear URL if files uploaded
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const dataUrl = e.target.result;
                    uploadedImageUrls.push(dataUrl);
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = '80px';
                    img.style.height = '80px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '4px';
                    gallery.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        async function createListing() {
            let finalImages = [...uploadedImageUrls];
            if (finalImages.length === 0 && document.getElementById("image").value) {
                finalImages.push(document.getElementById("image").value);
            }
            
            const data = {
                name: document.getElementById("name").value,
                type: document.getElementById("type").value,
                location: document.getElementById("location").value,
                price: parseFloat(document.getElementById("price").value),
                description: document.getElementById("description").value,
                images: finalImages,
                image: finalImages.length > 0 ? finalImages[0] : "", // fallback for single image
                contactNumber: document.getElementById("contactNumber").value,
            };

            const res = await fetch("/listings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            const msg = document.getElementById("formMsg");
            if (res.ok) {
                msg.textContent = "Listing created successfully!";
                msg.style.color = "green";
            } else {
                const err = await res.json();
                msg.textContent = err.message;
                msg.style.color = "red";
            }
        }
    </script>
</body>
</html>
