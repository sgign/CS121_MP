<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Create Listing</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/househop-tab-icon.png">
</head>

<body id="createListingPage">
    <div id="toastNotification" class="toast-notification"></div>
    <header class="main-header">
        <img src="/images/logo.png" alt="HouseHop" class="header-logo">
        <nav class="main-nav">
            <a href="/my-listings">My Listings</a>
            <a href="/booking-requests">Booking Requests</a>
            <a href="/logout">Logout</a>
        </nav>
    </header>

    <main class="host-main">
        <h1>Create New Listing</h1>

        <div class="form-card">
            <div class="input-group">
                <label>Listing Name</label>
                <input id="name" placeholder="e.g. Cozy Room in Makati">
            </div>
            <div class="input-group">
                <label>Type</label>
                <select id="type">
                    <option value="hotel">Hotel</option>
                    <option value="apartment">Apartment</option>
                    <option value="dorm">Dorm</option>
                    <option value="guest_room">Guest Room</option>
                </select>
            </div>
            <div class="input-group">
                <label>Location</label>
                <input id="location" placeholder="e.g. Manila">
            </div>
            <div class="input-group">
                <label>Price per Night (₱)</label>
                <input id="price" type="text" oninput="validatePriceInput(this)" placeholder="e.g. 1500">
            </div>
            <div class="input-group">
                <label>Description</label>
                <textarea id="description" placeholder="Describe your listing..."></textarea>
            </div>
            <div class="input-group">
                <label>Upload Photos (or URL)</label>
                <input id="image" placeholder="https://..." style="margin-bottom: 5px;">
                <input id="imageFile" type="file" multiple accept="image/*" onchange="previewImage(event)"
                    style="font-size: 12px; margin-bottom: 5px;">
                <div id="imageGallery" style="display:flex; flex-wrap:wrap; gap:10px; margin-top: 10px;"></div>
            </div>
            <div class="input-group">
                <label>Contact Number</label>
                <input id="contactNumber" oninput="validateContactInput(this)" placeholder="e.g. 09171234567">
            </div>

            <button onclick="createListing()">CREATE LISTING</button>
            <p id="formMsg"></p>
        </div>
    </main>

    <script>
        let uploadedImageUrls = [];

        function previewImage(event) {
            const files = Array.from(event.target.files);
            const gallery = document.getElementById('imageGallery');
            gallery.innerHTML = '';
            uploadedImageUrls = [];

            if (files.length > 0) {
                document.getElementById('image').value = ""; // Clear URL if files uploaded
            }

            files.forEach(file => {
                const reader = new FileReader();
                reader.onload = function (e) {
                    const dataUrl = e.target.result;
                    uploadedImageUrls.push(dataUrl);
                    const img = document.createElement('img');
                    img.src = dataUrl;
                    img.style.width = '80px';
                    img.style.height = '80px';
                    img.style.objectFit = 'cover';
                    img.style.borderRadius = '4px';
                    gallery.appendChild(img);
                };
                reader.readAsDataURL(file);
            });
        }

        let toastTimeout;
        function showToast(message, isError) {
            const toast = document.getElementById("toastNotification");
            if (!toast) return;
            toast.textContent = message;
            toast.className = "toast-notification " + (isError ? "error" : "success");
            toast.classList.add("show");

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => {
                toast.classList.remove("show");
            }, 4000);
        }

        function validatePriceInput(input) {
            if (/[^0-9]/.test(input.value)) {
                showToast("Price should consist of numbers only.", true);
                input.value = input.value.replace(/[^0-9]/g, '');
            }
        }

        function validateContactInput(input) {
            if (/[^0-9]/.test(input.value)) {
                showToast("Contact number should consist of numbers only.", true);
                input.value = input.value.replace(/[^0-9]/g, '');
            }
        }

        async function createListing() {
            const priceVal = document.getElementById("price").value;
            if (/[^0-9]/.test(priceVal) || priceVal === "") {
                showToast("Price should consist of valid numbers only.", true);
                return;
            }

            const contactNum = document.getElementById("contactNumber").value;
            if (/[^0-9]/.test(contactNum)) {
                showToast("Contact number should consist of numbers only.", true);
                return;
            }

            let finalImages = [...uploadedImageUrls];
            if (finalImages.length === 0 && document.getElementById("image").value) {
                finalImages.push(document.getElementById("image").value);
            }

            const data = {
                name: document.getElementById("name").value,
                type: document.getElementById("type").value,
                location: document.getElementById("location").value,
                price: parseFloat(document.getElementById("price").value),
                description: document.getElementById("description").value,
                images: finalImages,
                image: finalImages.length > 0 ? finalImages[0] : "", // fallback for single image
                contactNumber: document.getElementById("contactNumber").value,
            };

            const res = await fetch("/listings", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                showToast("Listing created successfully!", false);
            } else {
                const err = await res.json();
                showToast(err.message, true);
            }
        }
    </script>
</body>

</html>
