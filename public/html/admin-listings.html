<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Luckiest+Guy&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/househop-tab-icon.png">
</head>

<body class="admin-page">
    <header class="admin-header">
        <img src="/images/logo.png" alt="HouseHop" class="logo">
        <a href="/logout" class="logout">Logout</a>
    </header>

    <main class="admin-main">
        <h1 class="admin-title">ADMIN DASHBOARD</h1>

        <div class="admin-tabs-container">
            <div class="admin-tabs">
                <a href="/admin/users" class="admin-tab">USERS</a>
                <a href="/admin/listings" class="admin-tab active">LISTINGS</a>
                <a href="/admin/bookings" class="admin-tab">BOOKINGS</a>
            </div>

            <div class="admin-controls">
                <input type="text" id="searchListing" class="admin-search" placeholder="Search by Listing Name"
                    oninput="loadListings()">
                <div class="filters-container" style="position: relative;">
                    <button class="btn-filters" onclick="toggleFilters()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon>
                        </svg>
                        FILTERS
                    </button>
                    <div id="filterDropdown" class="filter-dropdown" style="display:none; top: 110%;">
                        <div class="filter-group">
                            <select id="filterType" onchange="loadListings()">
                                <option value="">Type</option>
                                <option value="hotel">Hotel</option>
                                <option value="apartment">Apartment</option>
                                <option value="dorm">Dorm</option>
                                <option value="guest_room">Guest Room</option>
                            </select>
                        </div>
                        <div class="filter-group">
                            <select id="filterPrice" onchange="loadListings()">
                                <option value="">Price</option>
                                <option value="price_asc">Ascending</option>
                                <option value="price_desc">Descending</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>UPLOAD PHOTO</th>
                        <th>LISTING NAME</th>
                        <th>HOST</th>
                        <th>TYPE</th>
                        <th>PRICE</th>
                        <th>ACTIONS</th>
                    </tr>
                </thead>
                <tbody id="listingsContainer">
                    <!-- Populated by JS -->
                </tbody>
            </table>
        </div>
    </main>

    <!-- Deletion Reason Modal -->
    <div id="deleteReasonModal" class="modal-overlay"
        style="display: none; align-items: center; justify-content: center; z-index: 2000;">
        <div class="modal-box"
            style="background: #fff; max-width: 450px; text-align: center; border-radius: 20px; padding: 40px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 100%;">
            <div style="font-size: 50px; margin-bottom: 15px;">⚠️</div>
            <h2 style="color: #333; font-size: 24px; font-weight: 800; margin-bottom: 15px; margin-top: 0;">DELETE LISTING</h2>
            <p style="font-size: 15px; color: #666; margin-bottom: 20px; line-height: 1.4;">
                Please enter a reason for deleting this listing. This will be shown to the host.
            </p>
            <input type="text" id="deleteReasonInput" placeholder="Reason for deletion..." style="width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 25px; font-family: Inter; font-size: 14px; box-sizing: border-box;">
            <div style="display: flex; justify-content: center; gap: 15px;">
                <button id="cancelDeleteBtn"
                    style="background: #f1f1f1; border: none; color: #555; padding: 12px 25px; border-radius: 50px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;">CANCEL</button>
                <button id="confirmDeleteBtn"
                    style="background: #d9534f; border: none; color: white; padding: 12px 25px; border-radius: 50px; font-weight: 700; font-size: 14px; cursor: pointer; transition: 0.2s;">DELETE</button>
            </div>
        </div>
    </div>

    <script>
        let allUsers = [];
        let listingToDeleteId = null;

        function toggleFilters() {
            const dropdown = document.getElementById('filterDropdown');
            const btn = document.querySelector('.btn-filters');
            if (dropdown.style.display !== 'flex') {
                dropdown.style.display = 'flex';
                btn.classList.add('active');
            } else {
                dropdown.style.display = 'none';
                btn.classList.remove('active');
            }
        }

        async function init() {
            const usersRes = await fetch("/admin/users-list");
            allUsers = await usersRes.json();
            loadListings();
        }

        async function loadListings() {
            const res = await fetch("/listings");
            let listings = await res.json();
            const container = document.getElementById("listingsContainer");
            const searchTerm = document.getElementById("searchListing").value.toLowerCase();
            const typeFilter = document.getElementById("filterType").value;
            const priceFilter = document.getElementById("filterPrice").value;
            container.innerHTML = "";

            if (priceFilter === "price_asc") {
                listings.sort((a, b) => a.price - b.price);
            } else if (priceFilter === "price_desc") {
                listings.sort((a, b) => b.price - a.price);
            }

            let filteredListings = listings.filter(l => {
                const matchesSearch = l.name.toLowerCase().includes(searchTerm);
                const matchesType = typeFilter === "" || l.type === typeFilter;
                return matchesSearch && matchesType;
            });

            if (filteredListings.length === 0) {
                container.innerHTML = "<tr><td colspan='7'>No listings found.</td></tr>";
                return;
            }

            const typeLabels = {
                hotel: "Hotel",
                apartment: "Apartment",
                dorm: "Dorm",
                guest_room: "Guest Room"
            };

            filteredListings.forEach(l => {
                const tr = document.createElement("tr");
                const imageUrl = (l.images && l.images.length > 0) ? l.images[0] : (l.image || '/images/placeholder.png');

                // Find host name
                const hostUser = allUsers.find(u => String(u.id) === String(l.hostId));
                const hostName = hostUser ? hostUser.username : l.hostId;

                const isDeleted = l.status === 'deleted';
                const rowClass = isDeleted ? 'style="opacity: 0.6; background-color: #f9f9f9;"' : '';
                const nameDisplay = isDeleted ? `<strong>${l.name}</strong> <br><span style="color:#d9534f; font-size:11px; font-weight:bold; letter-spacing:0.5px;">DELETED BY ADMIN</span>` : `<strong>${l.name}</strong>`;
                const actionBtn = isDeleted ? `<button class="action-btn" disabled style="opacity: 0.5; cursor: not-allowed;" title="Already Deleted">🗑️</button>` : `<button class="action-btn" onclick="deleteListing('${l._id}')" title="Delete Listing">🗑️</button>`;

                tr.innerHTML = `
                    <td ${rowClass}><img src="${imageUrl}" alt="${l.name}"></td>
                    <td ${rowClass}>${nameDisplay}</td>
                    <td ${rowClass}>${hostName}</td>
                    <td ${rowClass}>${typeLabels[l.type] || l.type}</td>
                    <td ${rowClass}>₱${l.price.toLocaleString()}/night</td>
                    <td ${rowClass}>
                        ${actionBtn}
                    </td>
                `;
                container.appendChild(tr);
            });
        }

        function deleteListing(id) {
            listingToDeleteId = id;
            document.getElementById("deleteReasonInput").value = "";
            document.getElementById("deleteReasonModal").style.display = "flex";
            document.getElementById("deleteReasonInput").focus();
        }

        document.getElementById("cancelDeleteBtn").addEventListener("click", () => {
            document.getElementById("deleteReasonModal").style.display = "none";
            listingToDeleteId = null;
        });

        document.getElementById("confirmDeleteBtn").addEventListener("click", async () => {
            if (!listingToDeleteId) return;
            const reason = document.getElementById("deleteReasonInput").value.trim();
            if (!reason) {
                alert("Please enter a reason.");
                return;
            }

            document.getElementById("deleteReasonModal").style.display = "none";
            
            await fetch("/listings/" + listingToDeleteId, { 
                method: "DELETE",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ reason })
            });
            loadListings();
        });

        init();
    </script>
</body>

</html>
