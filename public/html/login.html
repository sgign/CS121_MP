<!DOCTYPE html>
<html>

<head>
    <title>HouseHop - Login</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="icon" type="image/png" href="/images/househop-tab-icon.png">
</head>

<body id="loginPage">

    <div class="login-container">
        <img src="/images/logo.png" alt="HouseHop" class="logo">
        <p class="tagline">Hop to your next vacation getaway!</p>

        <div class="input-group">
            <input id="username" placeholder="Username">
        </div>
        <div class="input-group">
            <input id="password" type="password" placeholder="Password">
        </div>

        <button class="login-button" onclick="login()">LOGIN</button>
        <p id="loginMsg"></p>
    </div>

    <script>
        async function login() {
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if (res.ok) {
                const data = await res.json();
                if (data.role === "guest") window.location.href = "/browse";
                else if (data.role === "host") window.location.href = "/my-listings";
                else if (data.role === "admin") window.location.href = "/admin/listings";
            } else {
                document.getElementById("loginMsg").textContent = "Invalid credentials";
                document.getElementById("loginMsg").style.color = "red";
            }
        }
    </script>
</body>

</html>
